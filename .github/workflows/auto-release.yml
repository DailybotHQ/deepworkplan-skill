name: Auto-release on merge to main

# Conventional-commit-driven auto-release for the DeepWorkPlan skill, a
# markdown-first skill pack. Every merge to `main` produces a new GitHub
# Release unless the merge itself is the bot's own release commit.
#
# Bump rule (conventional-commit-aware, with PATCH as the safe default):
#   feat(...)!: / "BREAKING CHANGE:" in body  → MAJOR
#   feat(...):                                → MINOR
#   anything else (incl. no prefix)           → PATCH
#
# What it does:
#   1. Reads the current version from skills/deepworkplan/SKILL.md frontmatter
#      (the ROUTER SKILL.md is the single source of truth for the version)
#   2. Looks at commits since the last `vX.Y.Z` git tag and decides MAJOR/MINOR/PATCH
#   3. Writes the new version into ALL SKILL.md files (router + every sub-skill
#      + the devcontainer addon) so they stay in sync
#   4. Prepends a new section to CHANGELOG.md with the merged commits as bullets
#   5. Commits as "Dailybot Automations" with `[skip ci]` to break the loop
#   6. Tags `vX.Y.Z` and pushes
#   7. Dogfoods the just-published tag by fetching it via `npx skills add` into
#      .agents/skills/deepworkplan/ — doubles as a live smoke test of the
#      release AND keeps the in-repo dogfood copy at HEAD equal to the latest
#      released tag with no manual refresh commits (see Step "Dogfood").
#   8. Creates a GitHub Release with auto-generated notes

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, tag, release
    runs-on: ubuntu-latest
    # Skip our own release commits (infinite-loop guard) and any commit
    # explicitly tagged [skip release] (e.g. repo-infra-only changes).
    if: >-
      ${{
        !startsWith(github.event.head_commit.message, 'chore(release):')
        && !contains(github.event.head_commit.message, '[skip release]')
      }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Uses `AUTOMATION_GITHUB_TOKEN` (the org convention) so the bot
          # user (`dailybotops`) can push to the protected `main` branch.
          # Falls back to the default GITHUB_TOKEN, which will fail at the
          # push step unless `github-actions[bot]` is in the branch-protection
          # bypass list.
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up git identity
        run: |
          git config user.name "Dailybot Automations"
          git config user.email "ops@dailybot.com"

      - name: Determine bump level + new version
        id: version
        run: |
          set -euo pipefail
          # Read current version from the ROUTER SKILL.md (single source of truth).
          CURRENT=$(awk -F'"' '/^version:/ {print $2; exit}' skills/deepworkplan/SKILL.md)
          if [ -z "$CURRENT" ]; then
            echo "Could not read current version from skills/deepworkplan/SKILL.md" >&2
            exit 1
          fi

          # Find last release tag (vX.Y.Z). Empty if no tag yet.
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --invert-grep --grep='^chore(release):')
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --invert-grep --grep='^chore(release):')
          fi

          # Stop early if nothing meaningful since last tag.
          if [ -z "$COMMITS" ]; then
            echo "No releasable commits since ${LAST_TAG:-(repo start)}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^(feat|fix|chore|refactor|perf|build|ci|docs|test|style)(\([^)]*\))?!:' \
             || git log "${LAST_TAG:+${LAST_TAG}..HEAD}" --pretty=format:"%B" | grep -qE '^BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump version in ALL SKILL.md files
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          # Sync the new version across every SKILL.md under skills/deepworkplan
          # (router + create/execute/refine/resume/status/onboard + addons).
          while IFS= read -r f; do
            sed -i "s/^version: \".*\"/version: \"${NEW_VERSION}\"/" "$f"
          done < <(find skills/deepworkplan -name 'SKILL.md')

      - name: Update CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          # Passed via env (NOT inlined with ${{ }}) so commit messages
          # containing quotes, backticks, or $() can't break or inject into
          # this shell script.
          COMMITS: ${{ steps.version.outputs.commits }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Build the new section.
          {
            echo "## [${NEW_VERSION}] — ${DATE}"
            echo ""
            echo "### Changes"
            echo ""
            while IFS= read -r line; do
              [ -n "$line" ] && echo "- ${line}"
            done <<< "$COMMITS"
            echo ""
          } > /tmp/new_section.md

          # Insert the new section after the leading "# Changelog" header
          # paragraph but before the first existing version section.
          awk -v section_file=/tmp/new_section.md '
            BEGIN {
              while ((getline line < section_file) > 0) section = section line "\n"
              close(section_file)
              inserted = 0
            }
            /^## \[/ && !inserted { print section; inserted = 1 }
            { print }
            END {
              if (!inserted) print section
            }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit, tag, push
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git add -A
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          # Push the branch FIRST. If main is rejected (e.g. branch
          # protection), we bail out here BEFORE creating/pushing the tag, so
          # a failed run can never leave a dangling tag pointing at a commit
          # that isn't reachable from main (which would block every future
          # release with an "already exists" tag push).
          git push origin HEAD:main
          # main accepted the release commit — now tag that exact commit and
          # push the tag on its own.
          git tag -a "$NEW_TAG" -m "Release ${NEW_VERSION}"
          git push origin "refs/tags/${NEW_TAG}"

      - name: Dogfood — refresh vendored deepworkplan from the just-published tag
        # This repo dogfoods its own skill: `.agents/skills/deepworkplan/` is a
        # vendored copy managed via `skills-lock.json`, fetched exactly the way
        # any consumer would install it (`npx skills add`). Refreshing right
        # after the tag lands serves three purposes:
        #   1. Live smoke test — proves the just-pushed tag actually installs
        #      cleanly via `npx skills`. If the install script or the tag
        #      layout is broken, the workflow fails HERE (loudly) instead of a
        #      consumer discovering it silently.
        #   2. Keeps the in-repo dogfood copy at HEAD equal to the latest
        #      release (rather than the release before the one we just cut), so
        #      any contributor cloning fresh gets the current skill by default.
        #   3. Refreshes `skills-lock.json` with the new content hash so
        #      restore/verify flows stay accurate.
        # The commit message carries `[skip release]` so this push does NOT
        # re-trigger this workflow (the `if:` guard on the job catches it).
        if: steps.version.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          # Give GitHub a moment to propagate the just-pushed tag through the
          # API layer that backs `npx skills` (git-protocol tag reads are
          # instant; the REST/graphql surface occasionally lags a few seconds).
          sleep 5

          # Pin to the exact tag we just cut instead of letting `skills`
          # resolve "the newest matching tag". If the tag isn't visible yet
          # (propagation lag, publish failure), `npx skills add @<tag>` fails
          # loudly here — that's the whole point of the smoke test. A silent
          # "already up to date" would let a broken release slip through.
          #
          # Two separate `-y` / `--yes` flags below — they mean different
          # things and both are required in a non-TTY (Actions) environment:
          #   * `npx --yes` — auto-installs the `skills` npm package without
          #     the "Ok to proceed?" download prompt.
          #   * `skills add ... -y` — auto-selects the default install targets
          #     without the interactive agent-picker.
          echo "::group::npx skills add DailybotHQ/deepworkplan-skill@${NEW_TAG} --skill deepworkplan --force -y"
          npx --yes skills add "DailybotHQ/deepworkplan-skill@${NEW_TAG}" \
            --skill deepworkplan --force -y
          echo "::endgroup::"

          # Explicit invariant: the vendored SKILL.md's `version:` field MUST
          # equal the tag we just published. If it doesn't, `npx skills`
          # accepted the fetch but installed the wrong content — fail hard
          # rather than commit a misrepresented "dogfood" state.
          VENDORED_VERSION=$(
            sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' \
              .agents/skills/deepworkplan/SKILL.md | head -n1
          )
          if [ "${VENDORED_VERSION}" != "${NEW_VERSION}" ]; then
            echo "::error::Vendored SKILL.md version is '${VENDORED_VERSION}'"
            echo "::error::but the just-published tag is '${NEW_TAG}'"
            echo "::error::(expected frontmatter '${NEW_VERSION}')."
            echo "::error::Refusing to commit a stale dogfood snapshot."
            exit 1
          fi
          echo "OK: vendored deepworkplan at ${NEW_TAG} (verified)"

          # Empty diff after `--force` with a matching version assertion means
          # the working copy was already at this tag — no commit needed
          # (idempotent), but the smoke test PASSED (pinned fetch + version
          # check both succeeded).
          if git diff --quiet -- .agents/skills/deepworkplan skills-lock.json; then
            echo "Vendored deepworkplan already at ${NEW_TAG}; nothing to commit."
            exit 0
          fi

          git add .agents/skills/deepworkplan skills-lock.json
          git commit -m "chore(release): dogfood vendored deepworkplan to ${NEW_TAG} [skip release]"
          git push origin HEAD:main

      - name: Dogfood — refresh vendored dailybot to latest upstream
        # Keep the vendored `.agents/skills/dailybot/` at the latest published
        # tag of `DailybotHQ/agent-skill`. Runs on every release we cut so any
        # consumer cloning this repo at HEAD picks up the current dailybot
        # skill alongside deepworkplan.
        #
        # Mirror of the deepworkplan self-dogfood, adapted to a THIRD-PARTY
        # upstream: no `sleep 5` here — those upstream tags are stable and
        # already propagated through the API layer, so there's no
        # just-published race to wait out.
        #
        # A failed upstream tag lookup or version-invariant mismatch FAILS
        # this release: we should never publish a skill-repo tag whose
        # vendored dailybot misrepresents what upstream actually shipped
        # (a stale dogfood snapshot is silent breakage for consumers).
        #
        # Two separate `-y` / `--yes` flags below — same rationale as the
        # deepworkplan dogfood step: `npx --yes` covers npm's download
        # prompt, `skills add ... -y` covers the interactive agent-picker.
        # Upstream ai-diff-reviewer's v1.7.0 CHANGELOG codified this as
        # the auto-release-hang fix — keep BOTH flags.
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DB_TAG=$(gh release view --repo DailybotHQ/agent-skill --json tagName -q .tagName)
          if [ -z "$DB_TAG" ]; then
            echo "::error::Could not resolve latest release for DailybotHQ/agent-skill"
            exit 1
          fi
          echo "::notice::dailybot: latest published release is ${DB_TAG}"

          echo "::group::npx skills add DailybotHQ/agent-skill@${DB_TAG} --skill dailybot --force -y"
          npx --yes skills add "DailybotHQ/agent-skill@${DB_TAG}" --skill dailybot --force -y
          echo "::endgroup::"

          VENDORED=$(sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' .agents/skills/dailybot/SKILL.md | head -n1)
          if [ "${VENDORED}" != "${DB_TAG#v}" ]; then
            echo "::error::Vendored dailybot version '${VENDORED}' != requested tag '${DB_TAG}'"
            echo "::error::Refusing to commit a stale dogfood snapshot."
            exit 1
          fi
          echo "OK: vendored dailybot at ${DB_TAG} (verified)"

          if git diff --quiet -- .agents/skills/dailybot skills-lock.json; then
            echo "Vendored dailybot already at ${DB_TAG}; nothing to commit."
            exit 0
          fi
          git add .agents/skills/dailybot skills-lock.json
          git commit -m "chore(release): dogfood vendored dailybot to ${DB_TAG} [skip release]"
          git push origin HEAD:main

      - name: Dogfood — refresh vendored ai-diff-reviewer to latest upstream
        # Keep the vendored `.agents/skills/ai-diff-reviewer/` at the latest
        # published tag of `DailybotHQ/ai-diff-reviewer` (marketplace listing:
        # "AI Diff Reviewer"). This skill powers both the LOCAL review that
        # augments the mandatory DWP Security Review AND — via the
        # `pr-review.yml` workflow — the CI-side review that reads the same
        # `.review/extension.md`. Byte-identical prompt parity between the
        # skill's `prompt.md` and the CI Action's `prompts/default.md` is a
        # design property of the upstream project, enforced by their own
        # `Skills — prompt-sync invariant` CI job.
        #
        # Failure modes handled explicitly:
        #   * upstream tag lookup fails → hard fail (a downstream release
        #     without a resolvable upstream is a broken release);
        #   * vendored version ≠ requested tag → hard fail (the fetch may
        #     have succeeded but the content is wrong; a stale dogfood
        #     shipped as current is silent breakage for consumers).
        #
        # Both `--yes` and `-y` are required — see the header comment on
        # the dailybot step for the full rationale (upstream v1.7.0 fix).
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AIDR_TAG=$(gh release view --repo DailybotHQ/ai-diff-reviewer --json tagName -q .tagName)
          if [ -z "$AIDR_TAG" ]; then
            echo "::error::Could not resolve latest release for DailybotHQ/ai-diff-reviewer"
            exit 1
          fi
          echo "::notice::ai-diff-reviewer: latest published release is ${AIDR_TAG}"

          echo "::group::npx skills add DailybotHQ/ai-diff-reviewer@${AIDR_TAG} --skill ai-diff-reviewer --force -y"
          npx --yes skills add "DailybotHQ/ai-diff-reviewer@${AIDR_TAG}" --skill ai-diff-reviewer --force -y
          echo "::endgroup::"

          VENDORED=$(sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' .agents/skills/ai-diff-reviewer/SKILL.md | head -n1)
          if [ "${VENDORED}" != "${AIDR_TAG#v}" ]; then
            echo "::error::Vendored ai-diff-reviewer version '${VENDORED}' != requested tag '${AIDR_TAG}'"
            echo "::error::Refusing to commit a stale dogfood snapshot."
            exit 1
          fi
          echo "OK: vendored ai-diff-reviewer at ${AIDR_TAG} (verified)"

          if git diff --quiet -- .agents/skills/ai-diff-reviewer skills-lock.json; then
            echo "Vendored ai-diff-reviewer already at ${AIDR_TAG}; nothing to commit."
            exit 0
          fi
          git add .agents/skills/ai-diff-reviewer skills-lock.json
          git commit -m "chore(release): dogfood vendored ai-diff-reviewer to ${AIDR_TAG} [skip release]"
          git push origin HEAD:main

      - name: Generate provenance checksums
        if: steps.version.outputs.skip != 'true'
        # SHA256SUMS over the shipped runtime artifact (skills/deepworkplan).
        # Attached to the Release so users can verify provenance before running
        # the skill (see scripts/verify-integrity.sh and `setup.sh --verify`).
        run: bash scripts/generate-checksums.sh

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: SHA256SUMS
