name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow re-running the gate manually from the Actions tab if needed.
  workflow_dispatch: {}

# Cancel old runs of the same branch / PR when a new push lands. Saves CI
# minutes and keeps the most recent commit's status as the source of truth.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only on the GitHub token. Individual jobs that need more
# (writes, packages, releases) opt in explicitly.
permissions:
  contents: read

jobs:
  frontmatter-validation:
    name: SKILL.md frontmatter validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python3 scripts/validate-frontmatter.py

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on shipped + repo-dev scripts
        run: |
          # setup.sh is the only repo-root script; the shipped runtime scripts
          # are shared/context.sh and verify/conformance.sh. Lint all of them,
          # plus any scripts/*.sh.
          shellcheck setup.sh skills/deepworkplan/shared/context.sh skills/deepworkplan/verify/conformance.sh
          if ls scripts/*.sh >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          fi
          # Contributor scripts under tests/ are linted too: they gate the
          # published instruction-accounting numbers.
          if ls tests/efficiency/*.sh >/dev/null 2>&1; then
            shellcheck tests/efficiency/*.sh
          fi

  context-sh-smoke:
    name: context.sh smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Emits valid single-line JSON in a regular directory
        run: |
          OUTPUT=$(bash skills/deepworkplan/shared/context.sh)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | python3 -c 'import json,sys; json.loads(sys.stdin.read())'

      - name: Respects DWP_AGENT_TOOL override
        run: |
          export DWP_AGENT_TOOL="my-test-agent"
          OUTPUT=$(bash skills/deepworkplan/shared/context.sh)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -q '"agent_tool":"my-test-agent"' || {
            echo "FAIL: env override not honored"
            exit 1
          }

      - name: Respects DWP_DIR override
        run: |
          export DWP_DIR="/tmp/custom-dwp"
          OUTPUT=$(bash skills/deepworkplan/shared/context.sh)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -q '"dwp_dir":"/tmp/custom-dwp"' || {
            echo "FAIL: DWP_DIR override not honored"
            exit 1
          }

  bats-tests:
    name: bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test-only Python dependencies
        # Without these the schema, lifecycle and Lite-plan cases call
        # `skip "jsonschema not installed"` and the job goes green having
        # verified none of them. Missing dependencies are unavailable
        # validation, never a pass (docs/TESTING_GUIDE.md).
        run: pip install jsonschema pyyaml
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats tests
        run: bats tests/ | tee /tmp/bats.tap
      - name: Enforce the declared skip policy and a nonempty selection
        run: |
          set -euo pipefail
          # Bats exits 0 for an empty or fully filtered selection. Zero
          # selected is never success.
          planned="$(sed -n 's/^1\.\.\([0-9]*\)$/\1/p' /tmp/bats.tap | head -1)"
          if [ -z "$planned" ] || [ "$planned" -lt 300 ]; then
            echo "FAIL: TAP plan reports ${planned:-no} test(s) — the suite did not run"
            exit 1
          fi
          echo "OK: $planned tests planned"
          # Exactly one skip is environment-dependent and allowed: the
          # installer's no-agents auto-detect branch cannot be reached when an
          # agent binary is on PATH. Every other skip is a silent gap.
          if grep -n '# skip' /tmp/bats.tap | grep -v "auto-detect can't reach the 'no agents' branch"; then
            echo "FAIL: an undeclared skip occurred — see the lines above."
            echo "Required schema/lifecycle cases must execute, not skip."
            exit 1
          fi
          echo "OK: no undeclared skips"

  setup-smoke:
    name: setup.sh smoke (Linux + macOS bash 3.2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Confirm bash version
        run: bash --version
      - name: setup.sh --help runs cleanly
        run: bash setup.sh --help
      - name: setup.sh --host claude creates pack + sub-skill symlinks
        run: |
          # Point HOME at a temp dir so we don't touch the real agent config.
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.claude"
          bash setup.sh --host claude
          test -L "$HOME/.claude/skills/deepworkplan" || { echo "FAIL: pack symlink missing"; exit 1; }
          for v in create execute refine resume status verify onboard author upgrade; do
            test -L "$HOME/.claude/skills/deepworkplan-$v" || { echo "FAIL: deepworkplan-$v symlink missing"; exit 1; }
          done
          echo "OK: pack + nine sub-skill symlinks created"
      - name: setup.sh --host cursor creates pack + sub-skill symlinks
        run: |
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.cursor"
          bash setup.sh --host cursor
          test -L "$HOME/.cursor/skills/deepworkplan" || { echo "FAIL: pack symlink missing"; exit 1; }
          for v in create execute refine resume status verify onboard author upgrade; do
            test -L "$HOME/.cursor/skills/deepworkplan-$v" || { echo "FAIL: deepworkplan-$v symlink missing"; exit 1; }
          done
          echo "OK: cursor pack + nine sub-skill symlinks created"

  contract-checks:
    name: State-layer schema/contract + guide migration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install jsonschema
      - name: JSON Schema + contract regressions (fixtures, both directions, negative probes)
        run: python3 scripts/check-schema-contract.py
      - name: Split-guide links, section map and pointer headers
        run: python3 scripts/check-guide-migration.py
      - name: Instruction-load measurement runs (smoke)
        run: bash tests/efficiency/measure-instruction-load.sh >/dev/null

  python-floor:
    name: Runtime helpers on the Python 3.9 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: The shipped helpers must run stdlib-only on the documented floor
        # AGENTS.md and docs/TESTING_GUIDE.md claim "Python 3.9+ stdlib" for
        # every shipped helper. Nothing verified it: the rest of CI runs 3.11
        # with jsonschema and pyyaml installed, so a 3.10+ syntax feature or an
        # accidental third-party import would have shipped unnoticed.
        run: |
          set -euo pipefail
          python3 --version
          # No third-party package is installed in this job on purpose.
          for helper in skills/deepworkplan/shared/update-state.py \
                        skills/deepworkplan/shared/state_contract.py \
                        skills/deepworkplan/shared/finalize_plan.py \
                        skills/deepworkplan/shared/contract_v6.py \
                        skills/deepworkplan/shared/ledger.py \
                        skills/deepworkplan/shared/views.py \
                        skills/deepworkplan/shared/scheduler.py \
                        skills/deepworkplan/shared/outcomes.py \
                        skills/deepworkplan/shared/context_manifest.py \
                        skills/deepworkplan/shared/plan_paths.py \
                        skills/deepworkplan/shared/resources.py \
                        skills/deepworkplan/shared/migrate_v6.py \
                        skills/deepworkplan/shared/benchmark.py \
                        skills/deepworkplan/verify/plan_contract.py; do
            python3 -m py_compile "$helper"
            echo "OK: $helper compiles on $(python3 --version)"
          done
          # The v6 record validator must also RUN on the floor, not just
          # parse: its self-test is stdlib-only and touches no repository.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/contract_v6.py self-test
          # The v6 writer and views helpers likewise: their self-tests are
          # stdlib-only, run against throwaway temp directories and touch
          # no repository state.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/ledger.py self-test
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/views.py self-test
          # The authorization core as well: read-only, stdlib-only, its
          # self-test exercises the refusal pipeline in memory.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/scheduler.py self-test
          # The v6 outcome-verification helper as well: closure decisions,
          # receipts and review-state grammar; its self-test is stdlib-only
          # and runs against a throwaway plan directory.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/outcomes.py self-test
          # The v6 context-selection helper as well: manifest derivation,
          # dead-end digest, freshness and accounting are pure read-only
          # recomputations; its self-test builds a throwaway plan in memory.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/context_manifest.py self-test
          # The v6 resource helper as well: capability negotiation,
          # reserves, exhaustion holds and settlements; its self-test is
          # stdlib-only and runs against a throwaway plan directory.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/resources.py self-test
          # The v5 -> v6 migration helper as well: preview synthesis, the
          # guarded phase sequence and rollback; its self-test builds
          # throwaway v5 plans in a temp directory and touches no
          # repository state.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/migrate_v6.py self-test
          # The opt-in benchmark helper as well: config resolution, record
          # derivation, closed-field validation and the aggregate report;
          # its self-test builds throwaway plans in a temp directory,
          # touches no repository state and makes no network call.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            skills/deepworkplan/shared/benchmark.py self-test
          # And they must actually run, not merely parse: the read-only checker
          # over a real fixture plan, with no optional dependency available.
          python3 -c 'import jsonschema' 2>/dev/null && { echo "FAIL: jsonschema present — this job must prove the stdlib-only path"; exit 1; }
          WORK="$(mktemp -d)"
          cp -R tests/fixtures/lite-plan/.dwp "$WORK/.dwp"
          bash skills/deepworkplan/verify/conformance.sh --plan PLAN_lite_fixture "$WORK"
          echo "OK: the read-only checker runs on the documented floor without third-party packages"
      - name: Remove any bytecode the run left inside the pack
        # The pack is hash-pinned; a stray __pycache__ would be a diff.
        run: |
          find skills/deepworkplan -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          test -z "$(find skills/deepworkplan -name '__pycache__' -type d)" || {
            echo "FAIL: bytecode remains inside the installed pack"; exit 1; }

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check.json'
          # Only check repo-internal links by default (external can be flaky)
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
